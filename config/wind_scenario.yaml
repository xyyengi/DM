# ============================================================================
# 多变量协同条件扩散模型配置文件
# 
# 论文"2023-Conditional_Diffusion_Model.pdf"复现
# 
# 数据结构 (11维张量)：
# - Channel [0:3]: 风、光、负荷残差 (Residuals) - 生成核心主体
# - Channel [3:11]: 8维时间周期编码 (Sin/Cos) - 环境背景条件
# 
# 输出结构 (3维张量)：
# - Channel [0:3]: 风、光、负荷残差生成结果
# ============================================================================

# 训练配置
train:
  epochs: 200
  batch_size: 16
  lr: 1.0e-3

# 模型配置
model:
  # 输入输出通道
  in_channels: 11   # 11维输入（风、光、负荷残差 + 8维时间编码）
  out_channels: 3   # 3维输出（风、光、负荷残差）
  
  # 时间特征嵌入维度
  d_time: 64
  
  # Res-UNet基础通道数（确保容量足够区分特征）
  base_channels: 128
  
  # Res-UNet层数
  num_layers: 4
  
  # 扩散步数
  num_steps: 50
  
  # Beta schedule
  beta_start: 0.0001
  beta_end: 0.5
  schedule: "quad"
  
  # 条件引导强度 (公式10中的γ)
  guidance_scale: 1.0
  
  # KDE区间数量 (公式7中的区间划分)
  n_intervals: 10

# 数据配置
data:
  data_path: "./input_4.27/"
  seq_length: 168  # 7天 * 24小时
  n_channels: 11   # 11维输入特征
  
# 评估配置
evaluation:
  n_samples: 10    # 每个条件生成的场景数量
  quantiles: [0.8, 1.0]  # 评估的分位数区间
