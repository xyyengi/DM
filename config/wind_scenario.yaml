# ============================================================================
# 多变量协同条件扩散模型配置文件
# 
# 论文"2023-Conditional_Diffusion_Model.pdf"复现
# 
# 输入通道 (Total Input: 14 channels)：
# - Channel [0:3]: Target Residuals (正在去噪的风、光、负荷残差 x_t)
# - Channel [3:6]: Base Prediction (来自FEDformer的风、光、负荷预测趋势)
# - Channel [6:14]: Time Encoding (8维时间周期特征)
# 
# 输出结构 (3维张量)：
# - Channel [0:3]: 风、光、负荷残差噪声预测（只预测前3维）
# 
# KDE拟合：仅对Channel [0:3]（物理残差）进行概率密度建模和梯度引导
# ============================================================================

# 训练配置
train:
  epochs: 200
  batch_size: 64  # 32GB显存建议值
  lr: 5.0e-4  # 修复：从 1.0e-3 降低到 5.0e-4，缓解扩散模型高学习率震荡
  weight_decay: 1.0e-3  # L2正则化，防止过拟合
  patience: 20  # 早停耐心值

# 学习率调度器配置 (warmup + cosine annealing)
lr_scheduler:
  enabled: true  # 设为true启用，或使用 --use_lr_scheduler 参数
  initial_lr: 1.0e-4  # warmup起始学习率
  warmup_epochs: 10   # warmup轮数
  min_lr: 1.0e-6      # 最小学习率

# 模型配置
model:
  # 实验版本开关：
  # - V0: target_type=actual, condition_mode=none, use_forecast=false, use_guidance=false
  # - 当前 V1-like: target_type=residual, condition_mode=guidance_2023, use_forecast=true, use_guidance=true
  target_type: "residual"       # actual / residual
  condition_mode: "guidance_2023" # none / guidance_2023 / csdi_forecast
  use_forecast: true
  use_guidance: true
  cond_mask: [1, 1, 1]

  # 输入输出通道
  in_channels: 14   # 14维输入（Target Residuals + Base Prediction + Time Encoding）
  out_channels: 3   # 3维输出（只预测前3维的噪声）
  
  # 时间特征嵌入维度
  d_time: 64
  
  # Res-UNet基础通道数（之前128太大导致参数过剩严重过拟合）
  base_channels: 64
  
  # Res-UNet层数
  num_layers: 4
  
  # 扩散步数
  num_steps: 500
  
  # Beta schedule
  # 注意：beta_end标准值应<0.1，过大会导致扩散过程不稳定
  # DDPM原论文使用 beta_end=0.02 (linear) 或 0.012 (cosine)
  beta_start: 0.0001
  beta_end: 0.04  # 修复：从0.5改为0.02，标准DDPM值，后又改为了0.04，稍微增加扩散强度但不至于过大
  schedule: "linear"  # 从quad改为linear，更稳定的扩散过程
  
  # 条件引导强度 (公式10中的γ)
  # 【修复】增大引导强度使梯度引导生效
  # 0.05 太弱，改为 1.0 使条件约束真正起作用
  guidance_scale: 0.5  # 修复：从0.05增大到0.5，增强条件引导效果
  
  # KDE区间数量 (公式7中的区间划分)
  n_intervals: 10

# 推荐 V0 无条件 DDPM 开关（运行时可复制到 model 下，或新建单独配置文件）
experiment:
  name: "v1_like_residual_guidance_168h"

target:
  type: "residual" # actual / residual

condition:
  mode: "guidance_2023" # none / guidance_2023 / csdi_forecast
  use_forecast: true
  use_guidance: true
  cond_mask: [1, 1, 1]

guidance:
  enable: true
  wind_scale: 0.5
  pv_scale: 0.5
  load_scale: 0.5

# 数据配置
data:
  data_path: "./input_4.27/"
  seq_length: 168  # 7天 * 24小时
  n_channels: 11   # 11维输入特征
  
# 评估配置
evaluation:
  n_samples: 10    # 每个条件生成的场景数量
  quantiles: [0.8, 1.0]  # 评估的分位数区间
