# CSDI配置文件 - 用于时间序列预测任务 (Forecasting)
# 注意：当前条件c构建方式与论文"2023-Conditional_Diffusion_Model.pdf"不同
# 论文中条件c = [c_down, c_up] 是基于预测误差分布的区间
# 当前代码条件c = time_embed + feature_embed + cond_mask

train:
  epochs: 100
  batch_size: 8 
  lr: 1.0e-3
  itr_per_epoch: 1.0e+8

diffusion:
  layers: 4 
  channels: 64 
  nheads: 8
  diffusion_embedding_dim: 128
  beta_start: 0.0001
  beta_end: 0.5
  num_steps: 50
  schedule: "quad"
  is_linear: True

model:
  is_unconditional: 0
  timeemb: 128
  featureemb: 16
  target_strategy: "test"
  num_sample_features: 64
