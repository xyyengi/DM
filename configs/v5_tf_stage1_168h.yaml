experiment:
  name: "v5_tf_stage1_168h"
  family: "v5_stage1"

data:
  variables: ["wind", "pv", "load"]
  length: 168
  freq: "1H"
  data_path: "./diffusion_npy_normalized/"

target:
  type: "residual"
  residual_standardization:
    enabled: true
    fit_split: "train"
    fit_scope: "unique_stride_one_hours"
    epsilon: 1.0e-6

condition:
  mode: "sequence_film"
  use_forecast: true
  use_network_condition: true
  use_guidance: false
  cond_mask: [1, 1, 1]

guidance:
  enable: false
  method: "none"
  wind_scale: 0.0
  pv_scale: 0.0
  load_scale: 0.0
  num_bins: 10
  quantile_low: 0.10
  quantile_high: 0.90

sampling:
  reverse_variance_type: "posterior"

model:
  architecture: "v5_tf"
  input_channels: 3
  in_channels: 3
  out_channels: 3
  sequence_length: 168
  base_channels: 64
  num_layers: 3
  channel_multipliers: [1, 2, 4]
  group_norm_groups: 8
  dropout: 0.10
  timestep_embedding_dim: 128
  position_embedding_dim: 32
  use_sequence_condition: true
  n_intervals: 10
  num_steps: 500
  beta_start: 0.0001
  beta_end: 0.04
  schedule: "linear"

train:
  batch_size: 64
  lr: 5.0e-4
  epochs: 150
  weight_decay: 1.0e-3
  patience: 15
  save_every: 50
  seed: 2026
  validation_seed: 314159
  top_k_checkpoints: 3

event_sampling:
  enabled: false

lr_scheduler:
  enabled: false
  initial_lr: 1.0e-4
  warmup_epochs: 10
  min_lr: 1.0e-6

evaluation:
  n_samples: 20
  generation_seed: 424242
  solar_night_mode: "train_support"
  quantiles: [0.8, 0.9, 0.95, 1.0]
