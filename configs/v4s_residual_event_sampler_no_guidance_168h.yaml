experiment:
  name: "v4s_residual_event_sampler_no_guidance_168h"

data:
  variables: ["wind", "pv", "load"]
  length: 168
  freq: "1H"
  data_path: "./diffusion_npy_normalized/"

target:
  type: "residual"

condition:
  mode: "mix"
  use_forecast: true
  use_network_condition: true
  use_guidance: false
  cond_mask: [1, 1, 1]

guidance:
  enable: false
  method: "none"
  wind_scale: 0.0
  pv_scale: 0.0
  load_scale: 0.0
  num_bins: 10
  quantile_low: 0.10
  quantile_high: 0.90

model:
  input_channels: 14
  in_channels: 14
  out_channels: 3
  d_time: 64
  base_channels: 64
  num_layers: 4
  n_intervals: 10
  num_steps: 500
  beta_start: 0.0001
  beta_end: 0.04
  schedule: "linear"

train:
  batch_size: 64
  lr: 5.0e-4
  epochs: 150
  weight_decay: 1.0e-3
  patience: 15
  seed: 2026

event_sampling:
  enabled: true
  event_fraction: 0.20
  max_draws_per_event_per_epoch: 8
  event_types:
    - low_wind
    - low_renewable
    - low_solar_daily_energy
    - high_load
    - high_net_load
    - high_ramp_6h
  hierarchy: "event_type -> event_id -> lead_group -> window"
  eligible_mapping: "contains_event_start=true, lead_hours>=0, post_onset=false"
  threshold_fit: "train unique hourly actual only"
  threshold_levels: "P10/P90"
  persistent_min_duration_hours: 6
  persistent_max_gap_hours: 1

lr_scheduler:
  enabled: false
  initial_lr: 1.0e-4
  warmup_epochs: 10
  min_lr: 1.0e-6

evaluation:
  n_samples: 50
  quantiles: [0.8, 0.9, 0.95, 1.0]
