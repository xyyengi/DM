experiment:
  name: shandong91_heterogeneous_raw_body_v1_no_lead_gate1_smoke
  mode: gate1_smoke_only
data:
  data_path: ./reliable_channel_training_v1
  sequence_length: 168
  node_count: 91
  resource_count: 3
  channel_order: [Wind, Solar, Load]
model:
  architecture: shandong91_heterogeneous_raw_body_v1_no_lead
  sequence_length: 168
  node_count: 91
  resource_count: 3
  base_channels: 32
  num_layers: 3
  channel_multipliers: [1, 2, 4]
  group_norm_groups: 8
  dropout: 0.10
  timestep_embedding_dim: 128
  spatial_mode: fixed_graph
  spatial_gate_init: -1.0
  parallel_spatial_gate_init: -1.0
  use_lead_condition: false
  use_body_tail_experts: false
  use_jstd_tail: false
  use_joint_multiresidual_tail: false
  use_event_balanced_sampling: false
  use_self_localization: false
  use_protected_partial: false
  use_auxiliary_losses: false
diffusion:
  target: epsilon
  num_steps: 500
  beta_start: 0.0001
  beta_end: 0.04
loss:
  formal_objective: elementwise_effective_masked_mean
  resource_balanced_objective: diagnostic_only
gate1:
  seed: 2027
  batch_indices: [0]
  fixed_timestep: 137
  steps: 20
  optimizer: Adam
  learning_rate: 0.0003
  require_overall_loss_decrease: true
  require_each_resource_loss_decrease: true
  formal_training: false
  generation: false
