experiment:
  name: "v_mix_residual_forecast_concat_guidance"

data:
  variables: ["wind", "pv", "load"]
  length: 168
  freq: "1H"
  data_path: "./input_4.27/"

target:
  type: "residual"

condition:
  mode: "mix"
  use_forecast: true
  use_network_condition: true
  use_guidance: true
  cond_mask: [1, 1, 1]

guidance:
  enable: true
  method: "forecast_error_interval"
  wind_scale: 0.5
  pv_scale: 0.5
  load_scale: 0.5
  num_bins: 10
  quantile_low: 0.10
  quantile_high: 0.90

model:
  input_channels: 14
  in_channels: 14
  out_channels: 3
  d_time: 64
  base_channels: 64
  num_layers: 4
  n_intervals: 10
  num_steps: 500
  beta_start: 0.0001
  beta_end: 0.04
  schedule: "linear"

train:
  batch_size: 64
  lr: 5.0e-4
  epochs: 200
  weight_decay: 1.0e-3
  patience: 20
  seed: 2026

lr_scheduler:
  enabled: true
  initial_lr: 1.0e-4
  warmup_epochs: 10
  min_lr: 1.0e-6

evaluation:
  n_samples: 10
  quantiles: [0.8, 1.0]
