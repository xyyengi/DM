experiment:
  name: "v4_residual_forecast_time_no_guidance_168h"

data:
  variables: ["wind", "pv", "load"]
  length: 168
  freq: "1H"
  data_path: "./diffusion_npy_normalized/"

target:
  type: "residual"

condition:
  mode: "mix"
  use_forecast: true
  use_network_condition: true
  use_guidance: false
  cond_mask: [1, 1, 1]

guidance:
  enable: false
  method: "none"
  wind_scale: 0.0
  pv_scale: 0.0
  load_scale: 0.0
  num_bins: 10
  quantile_low: 0.10
  quantile_high: 0.90

model:
  input_channels: 14
  in_channels: 14
  out_channels: 3
  d_time: 64
  base_channels: 64
  num_layers: 4
  n_intervals: 10
  num_steps: 500
  beta_start: 0.0001
  beta_end: 0.04
  schedule: "linear"

train:
  batch_size: 64
  lr: 5.0e-4
  epochs: 150
  weight_decay: 1.0e-3
  patience: 15
  seed: 2026

lr_scheduler:
  enabled: false
  initial_lr: 1.0e-4
  warmup_epochs: 10
  min_lr: 1.0e-6

evaluation:
  n_samples: 20
  quantiles: [0.8, 0.9, 0.95, 1.0]
